# oe-demo-frontend — build the SPA image and serve it on :5188.
# nginx proxies /api -> the backend on the host (host.docker.internal:8000). Run the ATOM-OER backend
# (`docker compose up` in that repo, or `python -m main`) alongside this.
#
#   docker compose up --build      # -> http://localhost:5188
services:
  oe-demo-frontend:
    build:
      context: .
      args:
        VITE_API_BASE: ""          # same-origin: the app calls /api/... which nginx proxies to the backend
    image: oe-demo-frontend:local
    ports:
      - "5188:80"                  # host:container
    environment:
      # local: reach the backend on your Docker-Desktop host. In prod/k8s set this to the backend
      # Service, e.g. BACKEND_UPSTREAM=atom-oer-api:8000 (NEVER host.docker.internal outside Docker Desktop).
      BACKEND_UPSTREAM: host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
